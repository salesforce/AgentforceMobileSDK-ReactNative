name: PR Validation

# Trigger on pull requests to dev/main and pushes to dev/main (for verification)
on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Fast checks (lint, format, typecheck)
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate app config
        run: node scripts/generate-app-config.js service

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run TypeScript type check
        run: npm run typecheck

      # Verify the bridge is still a publishable package: it must build (tsc ->
      # lib/) and produce a clean tarball. Catches packaging regressions on dev
      # PRs before they can reach a release tag on main (see publish-npm-package.yml).
      - name: Verify bridge package builds & packs
        working-directory: AgentforceSDK-ReactNative-Bridge
        run: |
          npm run build
          npm pack --dry-run

  # Job 2: Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck  # Only run if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate app config
        run: node scripts/generate-app-config.js service

      - name: Run tests
        run: npm test -- --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job 3a: Android native unit tests (bridge library module, JVM — no emulator)
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate app config
        run: node scripts/generate-app-config.js employee

      - name: Run Android setup
        run: node installandroid.js employee

      - name: Run bridge unit tests
        run: cd android && ./gradlew :react-native-agentforce:testDebugUnitTest --console=plain

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: AgentforceSDK-ReactNative-Bridge/android/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # Job 3b: iOS native unit tests (bridge AgentMode logic — standalone XCTest bundle)
  ios-unit-tests:
    name: iOS Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.15.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Boost
        run: brew install boost

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.*.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate app config
        run: node scripts/generate-app-config.js employee

      - name: Run iOS setup (xcodegen + pod install)
        run: node installios.js employee

      - name: Run bridge unit tests
        run: |
          # Pick an available iPhone simulator by UDID. The `test` action requires a
          # concrete device (generic/by-name destinations are brittle across runner
          # image updates — model availability changes), so discover one at runtime.
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[dev['udid'] for rt in sorted(d) for dev in d[rt] if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found on the runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $DEVICE_ID"
          xcodebuild test \
            -workspace ios/ReactAgentforce.xcworkspace \
            -scheme BridgeUnitTests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID"

  # Job 4: Build validation matrix (parallel builds)
  build-validation:
    name: Build ${{ matrix.platform }} - ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: unit-tests  # Only run if tests pass

    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        include:
          # Android builds (Linux runner)
          - platform: Android
            variant: Service Agent
            os: ubuntu-latest
            setup-script: node installandroid.js service
            build-script: npm run build:android:service
            cache-paths: |
              ~/.gradle/caches
              ~/.gradle/wrapper
              android/.gradle
            cache-key: gradle

          - platform: Android
            variant: Employee Agent
            os: ubuntu-latest
            setup-script: node installandroid.js employee
            build-script: npm run build:android:employee
            cache-paths: |
              ~/.gradle/caches
              ~/.gradle/wrapper
              android/.gradle
            cache-key: gradle

          # iOS builds (macOS runner)
          - platform: iOS
            variant: Service Agent
            os: macos-26
            setup-script: node installios.js service
            build-script: npm run build:ios:service
            cache-paths: ios/Pods
            cache-key: pods

          - platform: iOS
            variant: Employee Agent
            os: macos-26
            setup-script: node installios.js employee
            build-script: npm run build:ios:employee
            cache-paths: ios/Pods
            cache-key: pods

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Java setup for Android builds
      - name: Setup Java (Android only)
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Install Boost for Android (via apt on Ubuntu)
      - name: Install Boost (Android only)
        if: matrix.platform == 'Android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      # Ruby setup for iOS builds (CocoaPods)
      - name: Setup Ruby (iOS only)
        if: matrix.platform == 'iOS'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      # Install CocoaPods for iOS
      - name: Install CocoaPods (iOS only)
        if: matrix.platform == 'iOS'
        run: |
          gem install cocoapods -v 1.15.2
          pod --version

      # Install XcodeGen for iOS
      - name: Install XcodeGen (iOS only)
        if: matrix.platform == 'iOS'
        run: |
          brew install xcodegen
          xcodegen --version

      # Install Boost for iOS
      - name: Install Boost (iOS only)
        if: matrix.platform == 'iOS'
        run: |
          brew install boost
          brew --prefix boost

      # Cache Gradle for Android
      - name: Cache Gradle dependencies (Android only)
        if: matrix.platform == 'Android'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: ${{ runner.os }}-${{ matrix.cache-key }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache-key }}-

      # Cache CocoaPods for iOS
      - name: Cache CocoaPods (iOS only)
        if: matrix.platform == 'iOS'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: ${{ runner.os }}-${{ matrix.cache-key }}-${{ hashFiles('ios/Podfile.*.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache-key }}-

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Generate app config
        run: node scripts/generate-app-config.js ${{ matrix.variant == 'Service Agent' && 'service' || 'employee' }}

      - name: Run platform setup
        run: ${{ matrix.setup-script }}

      - name: Build ${{ matrix.platform }} - ${{ matrix.variant }}
        run: ${{ matrix.build-script }}

      # Upload build logs on failure for debugging
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            android/app/build/outputs/**/*.log
            ios/build/Logs/**
          retention-days: 7
          if-no-files-found: ignore

  # Summary job - all checks must pass
  all-checks-passed:
    name: All Checks Passed ✓
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, android-unit-tests, ios-unit-tests, build-validation]
    if: always()

    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.android-unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.ios-unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-validation.result }}" != "success" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All PR checks passed!"
