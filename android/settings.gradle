pluginManagement { includeBuild('../node_modules/@react-native/gradle-plugin') }
plugins { id('com.facebook.react.settings') }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'ReactAgentforce'

apply from: 'agentforce-sdk-settings.gradle'

// Agentforce React Native bridge – provides JS API and native module
include ':react-native-agentforce'
project(':react-native-agentforce').projectDir = new File(rootProject.projectDir, '../AgentforceSDK-ReactNative-Bridge/android')
include ':app'

includeBuild('../node_modules/@react-native/gradle-plugin')
